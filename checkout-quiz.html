<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Checkout Quiz — Dart Maths Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Google Fonts loaded non-render-blockingly: preload the
       stylesheet in the background, then swap it in via onload.
       The page renders immediately on the CSS system-font
       fallbacks (see --font-display/--font-body/--font-mono in
       styles.css) and the real fonts apply the moment they
       arrive, instead of every navigation waiting on an external
       network round-trip before showing anything. The <noscript>
       fallback covers the rare case of JS being disabled. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  </noscript>
</head>
<body>

  <div class="app">

    <header class="app-header">
      <a href="index.html" class="home-link" aria-label="Back to home"><span class="home-link__icon" data-icon="arrowTriangle"></span></a>

      <div class="app-header__title-block">
        <span class="app-header__eyebrow">1-Dart Checkout Quiz</span>
        <h1 class="app-header__title">Dart Maths Trainer</h1>
      </div>
    </header>

    <!-- Session stats: one flattened full-width row instead of a
         boxed corner next to the title - trims vertical space, and
         drops the per-session reset control (lifetime stats, which
         matter longer-term, have their own reset on that page). -->
    <aside class="stats-bar" id="stats-panel" aria-label="Session statistics">
      <div class="stat">
        <span class="stat__value" id="stat-answered">0</span>
        <span class="stat__label">Answered</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-correct">0</span>
        <span class="stat__label">Correct</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-accuracy">—</span>
        <span class="stat__label">Accuracy</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-avg-time">—</span>
        <span class="stat__label">Avg time</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-streak">0</span>
        <span class="stat__label">Streak</span>
      </div>
    </aside>

    <main class="trainer-card" id="trainer-card">

      <p class="scoreboard__label">Score to check out</p>
      <p class="checkout-quiz-score" id="quiz-score">40</p>

      <p class="prompt">Which dart finishes it?</p>

      <form id="answer-form" class="answer-form" autocomplete="off">
        <input
          type="text"
          inputmode="none"
          readonly
          id="answer-input"
          class="answer-form__input"
          placeholder="—"
          aria-label="Your answer, e.g. D20 or Bull"
        />

        <!-- Shown in place of the input above once an answer is
             checked, instead of a separate block further down the
             page - see the .answer-result rule in styles.css for
             why. -->
        <div class="answer-result" id="answer-result" hidden>
          <p class="answer-result__headline" id="feedback-result"></p>
          <p class="answer-result__working answer-result__working--emphasis" id="feedback-working"></p>
          <p class="answer-result__time" id="feedback-time"></p>
        </div>

        <button type="submit" class="btn btn--primary" id="check-btn">Check</button>
      </form>

      <!--
        Custom checkout keypad: not a number pad. D/T are modifier
        keys (toggle which one, if any, is active) - tapping a
        number then applies that modifier, e.g. D active + tap 16
        -> "D16". Bull is its own single key since it has no
        single/double/treble variants in this app's notation.
      -->
      <div class="checkout-keypad" id="checkout-keypad">
        <div class="checkout-keypad__modifiers">
          <button type="button" class="checkout-keypad__modifier" data-modifier="D">D</button>
          <button type="button" class="checkout-keypad__modifier" data-modifier="T">T</button>
        </div>

        <div class="checkout-keypad__numbers">
          <button type="button" class="checkout-keypad__key" data-number="1">1</button>
          <button type="button" class="checkout-keypad__key" data-number="2">2</button>
          <button type="button" class="checkout-keypad__key" data-number="3">3</button>
          <button type="button" class="checkout-keypad__key" data-number="4">4</button>
          <button type="button" class="checkout-keypad__key" data-number="5">5</button>
          <button type="button" class="checkout-keypad__key" data-number="6">6</button>
          <button type="button" class="checkout-keypad__key" data-number="7">7</button>
          <button type="button" class="checkout-keypad__key" data-number="8">8</button>
          <button type="button" class="checkout-keypad__key" data-number="9">9</button>
          <button type="button" class="checkout-keypad__key" data-number="10">10</button>
          <button type="button" class="checkout-keypad__key" data-number="11">11</button>
          <button type="button" class="checkout-keypad__key" data-number="12">12</button>
          <button type="button" class="checkout-keypad__key" data-number="13">13</button>
          <button type="button" class="checkout-keypad__key" data-number="14">14</button>
          <button type="button" class="checkout-keypad__key" data-number="15">15</button>
          <button type="button" class="checkout-keypad__key" data-number="16">16</button>
          <button type="button" class="checkout-keypad__key" data-number="17">17</button>
          <button type="button" class="checkout-keypad__key" data-number="18">18</button>
          <button type="button" class="checkout-keypad__key" data-number="19">19</button>
          <button type="button" class="checkout-keypad__key" data-number="20">20</button>
        </div>

        <!-- Bull + Clear share one row instead of each getting a
             full-width row of their own - saves a whole row of
             vertical space, which matters on short phone screens
             where this page's tall keypad is the main thing
             pushing content below the fold. -->
        <div class="checkout-keypad__actions">
          <button type="button" class="checkout-keypad__key checkout-keypad__key--bull" data-bull="true">Bull</button>
          <button type="button" class="checkout-keypad__key checkout-keypad__key--muted" data-clear="true">Clear</button>
        </div>
      </div>

    </main>

  </div>

  <script src="js/random.js" defer></script>
  <script src="js/timer.js" defer></script>
  <script src="js/stats.js" defer></script>
  <script src="js/lifetimeStats.js" defer></script>
  <script src="js/checkoutEngine.js" defer></script>
  <script src="js/checkoutQuizEngine.js" defer></script>
  <script src="js/checkoutQuizUi.js" defer></script>
  <script src="js/checkoutQuizMain.js" defer></script>
  <script src="js/pickerIcons.js" defer></script>
  <script src="js/pickerIconsInit.js" defer></script>
</body>
</html>
