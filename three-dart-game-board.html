<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>3-Dart Game (Dartboard) — Dart Maths Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#17140F" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dart Maths" />

  <!-- Google Fonts loaded non-render-blockingly: preload the
       stylesheet in the background, then swap it in via onload.
       The page renders immediately on the CSS system-font
       fallbacks (see --font-display/--font-body/--font-mono in
       styles.css) and the real fonts apply the moment they
       arrive, instead of every navigation waiting on an external
       network round-trip before showing anything. The <noscript>
       fallback covers the rare case of JS being disabled. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  </noscript>
</head>
<body>

  <div class="app">

    <header class="app-header">
      <a href="index.html" class="home-link" aria-label="Back to home"><span class="home-link__icon" data-icon="arrowTriangle"></span></a>

      <div class="app-header__title-block">
        <span class="app-header__eyebrow">Scoring Practice · Dartboard</span>
        <h1 class="app-header__title">Dart Maths Trainer</h1>
      </div>
    </header>

    <!-- Session stats: one flattened full-width row instead of a
         boxed corner next to the title - trims vertical space, and
         drops the per-session reset control (lifetime stats, which
         matter longer-term, have their own reset on that page). -->
    <aside class="stats-bar" id="stats-panel" aria-label="Session statistics">
      <div class="stat">
        <span class="stat__value" id="stat-answered">0</span>
        <span class="stat__label">Answered</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-correct">0</span>
        <span class="stat__label">Correct</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-accuracy">—</span>
        <span class="stat__label">Accuracy</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-avg-time">—</span>
        <span class="stat__label">Avg time</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-streak">0</span>
        <span class="stat__label">Streak</span>
      </div>
    </aside>

    <!-- Main trainer card: everything needed for one question lives here -->
    <main class="trainer-card trainer-card--fill" id="trainer-card">

      <div class="scoreboard">
        <div class="scoreboard__row">
          <span class="scoreboard__label">Starting score</span>
          <span class="scoreboard__value" id="starting-score">501</span>
        </div>
      </div>

      <div class="throws">
        <span class="scoreboard__label">This visit</span>
        <div class="dartboard-wrap">
          <div id="dartboard-container"></div>
        </div>
      </div>

      <p class="prompt">What score is left?</p>

      <form id="answer-form" class="answer-form" autocomplete="off">
        <input
          type="text"
          inputmode="none"
          readonly
          id="answer-input"
          class="answer-form__input"
          placeholder="0"
          aria-label="Remaining score"
        />

        <!-- Shown in place of the input above once an answer is
             checked, instead of a separate block further down the
             page - see the .answer-result rule in styles.css for
             why. -->
        <div class="answer-result" id="answer-result" hidden>
          <p class="answer-result__headline" id="feedback-result"></p>
          <p class="answer-result__user-answer" id="feedback-user-answer" hidden></p>
          <div class="answer-result__darts" id="feedback-darts"></div>
          <p class="answer-result__progression" id="feedback-progression" hidden></p>
          <p class="answer-result__time" id="feedback-time"></p>
        </div>
      </form>

      <!--
        Custom on-screen numpad: on mobile, the input above is
        readonly (see js/gameBoardUi.js) specifically so tapping it
        never triggers the native OS keyboard, which would otherwise
        eat half the screen. This numpad is the actual input method
        on touch devices; a physical keyboard still works too via a
        keydown listener on the (readonly) input itself.

        Check/Next lives in the numpad grid itself (bottom-right,
        after 0) rather than next to the answer box - freeing the
        answer box to run the full width of the card, which it
        needs for longer working-out lines (e.g. three trebles) to
        fit on one line. It's still type="submit" and linked back
        to the form above via the form="answer-form" attribute, so
        Enter/clicking it behaves exactly as if it were inside the
        <form>. Clear has been dropped to make room - backspace
        (bottom-left) already covers correcting a mistake.
      -->
      <div class="numpad" id="numpad">
        <button type="button" class="numpad__key" data-key="1">1</button>
        <button type="button" class="numpad__key" data-key="2">2</button>
        <button type="button" class="numpad__key" data-key="3">3</button>
        <button type="button" class="numpad__key" data-key="4">4</button>
        <button type="button" class="numpad__key" data-key="5">5</button>
        <button type="button" class="numpad__key" data-key="6">6</button>
        <button type="button" class="numpad__key" data-key="7">7</button>
        <button type="button" class="numpad__key" data-key="8">8</button>
        <button type="button" class="numpad__key" data-key="9">9</button>
        <button type="button" class="numpad__key numpad__key--muted" data-key="backspace" aria-label="Backspace">⌫</button>
        <button type="button" class="numpad__key" data-key="0">0</button>
        <button type="submit" form="answer-form" class="numpad__key numpad__key--action" id="check-btn" aria-label="Check answer">✓</button>
      </div>

    </main>

  </div>

  <!--
    Loaded as plain scripts (not type="module") so the app works
    when opened directly from disk or from any static server, with
    no build step needed. Order matters: each file attaches to
    window.DartsTrainer, and later files depend on earlier ones
    being loaded first.

    Shares random.js / timer.js / aimData.js / aimModel.js /
    revealSequence.js / gameEngine.js / stats.js / dartboard.js with
    the flip-square game page unchanged - only gameBoardUi.js and
    gameBoardMain.js are specific to this page (dartboard display
    instead of flip squares).
  -->
  <script src="js/gameCore.bundle.js" defer></script>
  <script src="js/lifetimeStats.js" defer></script>
  <script src="js/dartboard.js" defer></script>
  <script src="js/scoreResultUi.js" defer></script>
  <script src="js/gameBoardUi.js" defer></script>
  <script src="js/gameBoardMain.js" defer></script>
  <script src="js/pickerIcons.bundle.js" defer></script>
  <script src="js/pwaRegister.js" defer></script>
</body>
</html>
