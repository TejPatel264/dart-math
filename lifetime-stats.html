<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>Lifetime Stats — Dart Maths Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#17140F" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dart Maths" />

  <!-- Google Fonts loaded non-render-blockingly: preload the
       stylesheet in the background, then swap it in via onload.
       The page renders immediately on the CSS system-font
       fallbacks (see --font-display/--font-body/--font-mono in
       styles.css) and the real fonts apply the moment they
       arrive, instead of every navigation waiting on an external
       network round-trip before showing anything. The <noscript>
       fallback covers the rare case of JS being disabled. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  </noscript>
</head>
<body>

  <div class="app">

    <header class="app-header">
      <a href="index.html" class="home-link" aria-label="Back to home"><span class="home-link__icon" data-icon="arrowTriangle"></span></a>

      <div class="app-header__title-block">
        <span class="app-header__eyebrow">Lifetime Progress</span>
        <h1 class="app-header__title">Dart Maths Trainer</h1>
      </div>
    </header>

    <main class="trainer-card">

      <!-- Player profile: name + favourite trebles/doubles. Sits
           above everything else on the page - stats are about what
           the player HAS done, this is about who they ARE, so it
           reads as the page's opening context rather than another
           stat card. Saved to the same lifetimeStats.js blob as
           everything else (see js/lifetimeStatsUi.js), but kept
           deliberately separate from "stats" conceptually - the
           reset button below only clears totals/streaks, not this. -->
      <section class="profile" id="profile" aria-label="Player profile">
        <div class="profile__name-row">
          <label class="profile__label" for="profile-name">Name</label>
          <input
            type="text"
            id="profile-name"
            class="profile__name-input"
            placeholder="Enter your name"
            maxlength="40"
            autocomplete="off"
          />
        </div>

        <div class="profile__favorites">
          <div class="profile__favorite-group">
            <span class="profile__label">Favourite Trebles</span>
            <div class="profile__select-row">
              <select id="profile-treble-0" class="profile__select" aria-label="Favourite treble, 1st"></select>
              <select id="profile-treble-1" class="profile__select" aria-label="Favourite treble, 2nd"></select>
            </div>
          </div>
          <div class="profile__favorite-group">
            <span class="profile__label">Favourite Doubles</span>
            <div class="profile__select-row">
              <select id="profile-double-0" class="profile__select" aria-label="Favourite double, 1st"></select>
              <select id="profile-double-1" class="profile__select" aria-label="Favourite double, 2nd"></select>
            </div>
          </div>
        </div>
      </section>

      <!-- Play Streak: consecutive calendar days with at least one
           question answered in ANY mode - a different kind of stat
           to the per-mode breakdown below (it's about showing up,
           not about any one game), so it gets its own banner. -->
      <section class="play-streak" id="play-streak" aria-label="Play streak">
        <div class="play-streak__current">
          <span class="play-streak__flame" data-icon="flame"></span>
          <div class="play-streak__current-text">
            <span class="play-streak__value" id="play-streak-current">0</span>
            <span class="play-streak__label">Day Play Streak</span>
          </div>
        </div>
        <div class="play-streak__best">
          <span class="play-streak__best-value" id="play-streak-best">0</span>
          <span class="play-streak__best-label">Best</span>
        </div>
      </section>

      <!-- Combined totals across every mode - the headline number. -->
      <section class="lifetime-summary" id="lifetime-summary" aria-label="Combined lifetime statistics">
        <div class="lifetime-summary__grid">
          <div class="lifetime-summary__stat">
            <span class="lifetime-summary__value" id="summary-answered">0</span>
            <span class="lifetime-summary__label">Total Questions</span>
          </div>
          <div class="lifetime-summary__stat">
            <span class="lifetime-summary__value" id="summary-accuracy">—</span>
            <span class="lifetime-summary__label">Accuracy</span>
          </div>
          <div class="lifetime-summary__stat">
            <span class="lifetime-summary__value" id="summary-avg-time">—</span>
            <span class="lifetime-summary__label">Avg Time</span>
          </div>
        </div>
      </section>

      <!-- Per-mode breakdown, populated by lifetimeStatsUi.js -->
      <section class="lifetime-modes" id="lifetime-modes" aria-label="Statistics by game mode">
        <!-- .lifetime-mode-card elements injected here -->
      </section>

      <button type="button" class="lifetime-reset-btn" id="lifetime-reset-btn">
        Reset all lifetime stats
      </button>

    </main>

  </div>

  <script src="js/lifetimeStats.js" defer></script>
  <script src="js/lifetimeStatsUi.js" defer></script>
  <script src="js/pickerIcons.bundle.js" defer></script>
  <script src="js/pwaRegister.js" defer></script>
</body>
</html>
