<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>3-Dart Practice — Dart Maths Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Google Fonts loaded non-render-blockingly: preload the
       stylesheet in the background, then swap it in via onload.
       The page renders immediately on the CSS system-font
       fallbacks (see --font-display/--font-body/--font-mono in
       styles.css) and the real fonts apply the moment they
       arrive, instead of every navigation waiting on an external
       network round-trip before showing anything. The <noscript>
       fallback covers the rare case of JS being disabled. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  </noscript>
</head>
<body>

  <div class="app">

    <header class="app-header">
      <a href="index.html" class="home-link" aria-label="Back to home">←</a>

      <div class="app-header__title-block">
        <span class="app-header__eyebrow">Choose a Style</span>
        <h1 class="app-header__title">3-Dart Practice</h1>
      </div>
    </header>

    <!--
      Picker page - see game-picker.html for the fuller rationale
      on why this is a dedicated screen rather than a home-page
      pill or an in-game toggle.
    -->
    <main class="trainer-card trainer-card--fill" id="picker-card">
      <div class="picker-cards">
        <a href="3-dart-practice.html" class="picker-card">
          <span class="picker-card__icon" data-icon="flipCards"></span>
          <span class="picker-card__title">Flip Cards</span>
          <span class="picker-card__description">Three squares flip to reveal each throw - quick and minimal.</span>
        </a>
        <a href="3-dart-practice-board.html" class="picker-card">
          <span class="picker-card__icon" data-icon="dartboard"></span>
          <span class="picker-card__title">Dartboard</span>
          <span class="picker-card__description">Each throw lands on a real dartboard - see exactly where it hit.</span>
        </a>
      </div>
    </main>

  </div>

  <script src="js/pickerIcons.js" defer></script>
  <script src="js/pickerIconsInit.js" defer></script>
</body>
</html>
