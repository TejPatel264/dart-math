<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>3-Dart Practice — Dart Maths Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#17140F" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dart Maths" />

  <!-- Google Fonts loaded non-render-blockingly: preload the
       stylesheet in the background, then swap it in via onload.
       The page renders immediately on the CSS system-font
       fallbacks (see --font-display/--font-body/--font-mono in
       styles.css) and the real fonts apply the moment they
       arrive, instead of every navigation waiting on an external
       network round-trip before showing anything. The <noscript>
       fallback covers the rare case of JS being disabled. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  </noscript>
</head>
<body>

  <div class="app">

    <header class="app-header">
      <a href="index.html" class="home-link" aria-label="Back to home"><span class="home-link__icon" data-icon="arrowTriangle"></span></a>

      <div class="app-header__title-block">
        <span class="app-header__eyebrow">Choose a Style</span>
        <h1 class="app-header__title">3-Dart Practice</h1>
      </div>
    </header>

    <!--
      Setup picker - combines the Game Mode choice (Unlimited/
      Timer/Streak) and View choice (flip-cards vs dartboard) on
      one screen, staged as selection state rather than each card
      navigating immediately - see js/setupPicker.js. Unlimited is
      auto-selected on load (it's the only mode with a dartboard
      variant), so the Play button is always ready to go - no
      disabled state to wait out. Streak mode only has a flip-cards
      build for now (see streak-practice.html) - selecting it while
      Dartboard is the active View still lands on the flip-cards
      page, since js/setupPicker.js falls back to a mode's plain
      href whenever no *-board variant is set. See game-picker.html
      for the TRACK equivalent (Streak is still Coming Soon there).
    -->    <main class="trainer-card trainer-card--fill" id="picker-card">
      <div class="setup-picker">

        <div class="mode-divider" role="separator">
          <span class="mode-divider__label">Game Mode</span>
        </div>

        <div class="setup-picker__modes">
          <button
            type="button"
            class="setup-card setup-card--mode"
            data-mode-href="3-dart-practice.html"
            data-mode-href-board="3-dart-practice-board.html"
            data-mode-default="true"
          >
            <span class="setup-card__icon" data-icon="infinity"></span>
            <span class="setup-card__title">Unlimited</span>
          </button>
          <button type="button" class="setup-card setup-card--mode setup-card--disabled" disabled>
            <span class="setup-card__icon" data-icon="clock"></span>
            <span class="setup-card__title">Timer</span>
            <span class="setup-card__badge">Coming soon</span>
          </button>
          <button
            type="button"
            class="setup-card setup-card--mode"
            data-mode-href="streak-practice.html"
          >
            <span class="setup-card__icon" data-icon="flame"></span>
            <span class="setup-card__title">Streak</span>
          </button>
        </div>

        <div class="mode-divider" role="separator">
          <span class="mode-divider__label">View</span>
        </div>

        <div class="setup-picker__view">
          <button type="button" class="setup-card" data-view="flipCards" data-view-default="true">
            <span class="setup-card__icon" data-icon="flipCards"></span>
            <span class="setup-card__title">Flip Cards</span>
          </button>
          <button type="button" class="setup-card" data-view="dartboard">
            <span class="setup-card__icon" data-icon="dartboard"></span>
            <span class="setup-card__title">Dartboard</span>
          </button>
        </div>

        <div class="setup-picker__play-divider mode-divider" role="separator" aria-hidden="true"></div>

        <div class="setup-picker__play">
          <a href="#" id="setup-play-btn" class="setup-play-btn">Play</a>
        </div>

      </div>
    </main>

  </div>

  <script src="js/pickerIcons.bundle.js" defer></script>
  <script src="js/prefetch.js" defer></script>
  <script src="js/setupPicker.js" defer></script>
  <script src="js/pwaRegister.js" defer></script>
</body>
</html>
