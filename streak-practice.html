<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>Beat the Referee — Dart Maths Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#17140F" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dart Maths" />

  <!-- Google Fonts loaded non-render-blockingly - see 3-dart-practice.html for the fuller rationale. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  </noscript>
</head>
<body>

  <div class="app">

    <header class="app-header">
      <a href="index.html" class="home-link" aria-label="Back to home"><span class="home-link__icon" data-icon="arrowTriangle"></span></a>

      <div class="app-header__title-block">
        <span class="app-header__eyebrow">Beat the Referee</span>
        <h1 class="app-header__title">Dart Maths Trainer</h1>
      </div>
    </header>

    <!-- Today's stats: Best (streak), Average time, and Accuracy -
         scoped to every run played today (see js/streakDailyStats.js),
         not the current run, so these persist across Play Again and
         page reloads within the same day rather than resetting like
         a normal session stat. Attempts/Answered is deliberately not
         shown here - in Streak mode it's always identical to the
         current streak until the first wrong answer, so it never
         adds information beyond what the streak display already
         shows. -->
    <aside class="stats-bar" id="stats-panel" aria-label="Today's statistics">
      <div class="stat">
        <span class="stat__value" id="stat-best">0</span>
        <span class="stat__label">Best</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-avg-time">—</span>
        <span class="stat__label">Avg Time</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-accuracy">—</span>
        <span class="stat__label">Accuracy</span>
      </div>
    </aside>

    <!-- Main trainer card: everything needed for one question lives here -->
    <main class="trainer-card trainer-card--fill" id="trainer-card">

      <!-- Referee intro: shown full-focus for the first 3 seconds
           of a run before settling into the compact Target cell
           below - see js/streakMain.js. Sits in the same spot the
           throws/prompt would otherwise occupy, so nothing shifts
           position when it's swapped out. -->
      <div class="referee-intro" id="referee-intro" hidden>
        <span class="referee-intro__eyebrow">The Referee</span>
        <p class="referee-intro__line">
          The referee got <span class="referee-intro__value" id="referee-intro-target">0</span>.
        </p>
        <p class="referee-intro__question">Can you beat it?</p>
      </div>

      <!-- Current-run Target / Streak / Timer, all three scoped to
           this run - this is the trio that actually changes
           moment to moment during play, so it sits right above the
           throw squares rather than in the stats bar, which now
           only holds slower-moving, all-day figures. Hidden until
           the last throw is revealed and the clock genuinely
           starts - see js/streakMain.js. -->
      <div class="streak-live" id="streak-timer" hidden>
        <div class="streak-live__cell">
          <span class="streak-live__value" id="stat-target">0</span>
          <span class="streak-live__label">Target</span>
        </div>
        <span class="streak-live__divider" aria-hidden="true"></span>
        <div class="streak-live__cell">
          <span class="streak-live__value" id="stat-streak">0</span>
          <span class="streak-live__label">Streak</span>
        </div>
        <span class="streak-live__divider" aria-hidden="true"></span>
        <div class="streak-live__cell">
          <span class="streak-live__value" id="streak-timer-value">30.0</span>
          <span class="streak-live__label">Timer</span>
        </div>
      </div>

      <div class="throws">
        <span class="scoreboard__label">This visit</span>
        <div class="throw-squares" id="throw-squares">
          <div class="throw-square" id="throw-square-0">
            <div class="throw-square__inner">
              <div class="throw-square__face throw-square__face--front" aria-hidden="true">•</div>
              <div class="throw-square__face throw-square__face--back" id="throw-square-0-label"></div>
            </div>
          </div>
          <div class="throw-square" id="throw-square-1">
            <div class="throw-square__inner">
              <div class="throw-square__face throw-square__face--front" aria-hidden="true">•</div>
              <div class="throw-square__face throw-square__face--back" id="throw-square-1-label"></div>
            </div>
          </div>
          <div class="throw-square" id="throw-square-2">
            <div class="throw-square__inner">
              <div class="throw-square__face throw-square__face--front" aria-hidden="true">•</div>
              <div class="throw-square__face throw-square__face--back" id="throw-square-2-label"></div>
            </div>
          </div>
        </div>
      </div>

      <p class="prompt">What's the total?</p>

      <form id="answer-form" class="answer-form" autocomplete="off">
        <input
          type="text"
          inputmode="none"
          readonly
          id="answer-input"
          class="answer-form__input"
          placeholder="0"
          aria-label="Total of the three throws"
        />

        <!-- Shown in place of the input above once an answer is
             checked - same pattern as Unlimited practice. -->
        <div class="answer-result" id="answer-result" hidden>
          <p class="answer-result__headline" id="feedback-result"></p>
          <p class="answer-result__working answer-result__working--emphasis" id="feedback-working"></p>
          <p class="answer-result__time" id="feedback-time"></p>
        </div>
      </form>

      <!-- Custom on-screen numpad - see 3-dart-practice.html for the fuller rationale. -->
      <div class="numpad" id="numpad">
        <button type="button" class="numpad__key" data-key="1">1</button>
        <button type="button" class="numpad__key" data-key="2">2</button>
        <button type="button" class="numpad__key" data-key="3">3</button>
        <button type="button" class="numpad__key" data-key="4">4</button>
        <button type="button" class="numpad__key" data-key="5">5</button>
        <button type="button" class="numpad__key" data-key="6">6</button>
        <button type="button" class="numpad__key" data-key="7">7</button>
        <button type="button" class="numpad__key" data-key="8">8</button>
        <button type="button" class="numpad__key" data-key="9">9</button>
        <button type="button" class="numpad__key numpad__key--muted" data-key="backspace" aria-label="Backspace">⌫</button>
        <button type="button" class="numpad__key" data-key="0">0</button>
        <button type="submit" form="answer-form" class="numpad__key numpad__key--action" id="check-btn" aria-label="Check answer">✓</button>
      </div>

      <!-- Streak-over screen: replaces everything above once a
           wrong answer (or an expired timer) ends the run. Sits
           in the same card rather than navigating to a separate
           page, so Play Again can reset state in place instead of
           needing a fresh page load. -->
      <div class="streak-over" id="streak-over" hidden>
        <span class="streak-over__eyebrow">Streak ended</span>
        <span class="streak-over__value" id="streak-over-value">0</span>
        <span class="streak-over__label">Correct in a row</span>
        <p class="streak-over__detail" id="streak-over-detail"></p>
        <p class="streak-over__referee-result" id="streak-over-referee-result"></p>
        <button type="button" class="streak-over__play-again" id="play-again-btn">Play Again</button>
      </div>

    </main>

  </div>

  <!--
    Loaded as plain scripts (not type="module") - see
    3-dart-practice.html for the fuller rationale. Shares every
    file with Unlimited practice except streakUi.js/streakMain.js
    (in place of practiceUi.js/practiceMain.js), plus the addition
    of countdownTimer.js (per-question clock), streakTiming.js
    (how long each question gets), streakDailyStats.js (today's
    Best/Avg Time/Accuracy), and refereeTarget.js (the Beat the
    Referee target score).
  -->
  <script src="js/gameCore.bundle.js" defer></script>
  <script src="js/countdownTimer.js" defer></script>
  <script src="js/streakTiming.js" defer></script>
  <script src="js/streakDailyStats.js" defer></script>
  <script src="js/refereeTarget.js" defer></script>
  <script src="js/lifetimeStats.js" defer></script>
  <script src="js/streakUi.js" defer></script>
  <script src="js/streakMain.js" defer></script>
  <script src="js/pickerIcons.bundle.js" defer></script>
  <script src="js/pwaRegister.js" defer></script>
</body>
</html>
